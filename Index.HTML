<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Capture</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        input[type="email"] {
            width: 250px;
            padding: 10px;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Enter Your Email</h2>
    <p>We’ll notify you with important updates.</p>

    <form id="emailForm">
        <input type="email" id="email" placeholder="Enter your email" required>
        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById("emailForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Stop page reload
            
            let email = document.getElementById("email").value;

            // Send data to email (Formspree)
            fetch("https://formspree.io/f/mjkgeapy", { 
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });

            // Save to Google Sheets (Webhook)
            fetch("https://script.google.com/macros/s/AKfycbwzIGb-fVifE9hpKetUnCnDzDI0NftT1z8LTEfDdFbG9YBOgFAsNchP9R1p9ISjD3s5/exec", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });

            alert("Email submitted successfully!");
            document.getElementById("email").value = "";
        });
    </script>

</body>
</html>
